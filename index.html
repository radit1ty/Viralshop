<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ViralShop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    h1, h2 {
      color: #333;
    }
    .user-bar {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      background-color: #333;
      color: white;
      padding: 10px;
    }
    .user-bar button {
      background-color: #ff5a5f;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }
    .produk {
      padding: 20px;
    }
    .produk-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 0;
    }
    .produk-item {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      padding: 15px;
      text-align: center;
    }
    .produk-item img {
      width: 100%;
      border-radius: 8px;
      height: 150px;
      object-fit: cover;
    }
    .produk-item button {
      background-color: #ff5a5f;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Modal Keranjang */
    .modal, .order-now-box, .tracking-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content, .tracking-modal-content {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      width: 400px;
      max-height: 80%;
      overflow-y: auto;
    }

    .remove-button {
      background-color: #f44336;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .track-button {
      background-color: #4caf50;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .track-status {
      margin-top: 10px;
      color: #ff9800;
    }

    /* Media Queries untuk tampilan responsif */
    @media (max-width: 768px) {
      .produk-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .produk-list {
        grid-template-columns: 1fr;
      }
      .produk-item {
        padding: 10px;
      }
      .produk-item img {
        height: 120px;
      }
    }

    /* Styling untuk Lihat Pesanan */
    #orders-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .order-item h4 {
      margin: 0;
      color: #333;
    }

    .order-item .order-status {
      padding: 5px 10px;
      border-radius: 5px;
      background-color: #ff9800;
      color: white;
      font-weight: bold;
    }

    .order-item .track-button {
      background-color: #4caf50;
      padding: 5px 10px;
      border-radius: 5px;
      color: white;
    }

    .order-item .remove-button {
      background-color: #f44336;
      padding: 5px 10px;
      border-radius: 5px;
      color: white;
    }
  </style>
</head>
<body>

<header>
  <h1>ViralShop</h1>
  <div class="user-bar">
    <span id="user-welcome"></span>
    <button onclick="openCart()">Keranjang (<span id="cart-count">0</span>)</button>
    <button onclick="viewOrders()">Lihat Pesanan</button>
    <button id="loginBtn" onclick="showLoginForm()">Login</button>
    <button id="logoutBtn" onclick="logout()" style="display: none;">Logout</button>
  </div>
</header>

<section class="produk">
  <h2>Produk Unggulan</h2>
  <div class="produk-list">
    <div class="produk-item">
      <img src="AyamGeprek.jpg" />
      <h3>Geprek Ral</h3>
      <p>Rp 12.000</p>
      <button onclick="addToCart('Geprek Ral', 12000)">Beli</button>
    </div>
    <div class="produk-item">
      <img src="MieGacoan.jpg" />
      <h3>Produk 2</h3>
      <p>Rp 6.000</p>
      <button onclick="addToCart('Mie Gacoan', 6000)">Beli</button>
    </div>
  </div>
</section>

<!-- Modal Keranjang -->
<div id="cart" class="modal">
  <div class="modal-content">
    <h3>Keranjang Anda</h3>
    <ul id="cart-items"></ul>
    <p>Total: Rp <span id="cart-total">0</span></p>
    <button onclick="orderNow()">Pesan Sekarang</button>
    <button class="btn-close" onclick="closeCart()">Tutup</button>
  </div>
</div>

<!-- Modal Form Pemesanan -->
<div id="order-now" class="modal">
  <div class="modal-content">
    <h3>Formulir Pemesanan</h3>
    <input type="text" id="order-name" placeholder="Nama" /><br><br>
    <input type="text" id="order-address" placeholder="Alamat" /><br><br>
    <input type="text" id="order-phone" placeholder="No. Telepon" /><br><br>
    <button onclick="submitOrder()">Kirim Pesanan</button>
    <button onclick="closeOrderForm()">Batal</button>
  </div>
</div>

<!-- Modal Lihat Pesanan -->
<div id="orders" class="modal">
  <div class="modal-content">
    <h3>Pesanan Saya</h3>
    <div id="orders-list"></div>
    <button class="btn-close" onclick="closeOrders()">Tutup</button>
  </div>
</div>

<!-- Modal Tracking -->
<div id="tracking" class="tracking-modal">
  <div class="tracking-modal-content">
    <h3>Tracking Pesanan</h3>
    <div id="tracking-details"></div>
    <div id="chat-box">
      <h4>Chat Kurir</h4>
      <div id="chat-messages"></div>
      <button onclick="closeTracking()">Tutup</button>
    </div>
  </div>
</div>

<script>
  let cart = [];
  let user = null;
  let userOrders = JSON.parse(localStorage.getItem('orders')) || [];

  function showLoginForm() {
    const username = prompt("Masukkan nama pengguna:");
    if (username) {
      user = { username };
      localStorage.setItem("user", JSON.stringify(user));
      document.getElementById("user-welcome").textContent = `Halo, ${username}`;
      document.getElementById("loginBtn").style.display = "none";
      document.getElementById("logoutBtn").style.display = "inline";
    }
  }

  function logout() {
    localStorage.removeItem("user");
    user = null;
    document.getElementById("user-welcome").textContent = "";
    document.getElementById("loginBtn").style.display = "inline";
    document.getElementById("logoutBtn").style.display = "none";
  }

  function addToCart(name, price) {
    cart.push({ name, price });
    updateCartDisplay();
  }

  function updateCartDisplay() {
    const cartItemsContainer = document.getElementById("cart-items");
    const cartTotal = document.getElementById("cart-total");
    cartItemsContainer.innerHTML = "";
    let total = 0;
    cart.forEach(item => {
      total += item.price;
      const li = document.createElement("li");
      li.textContent = `${item.name} - Rp ${item.price}`;
      cartItemsContainer.appendChild(li);
    });
    cartTotal.textContent = total;
  }

  function openCart() {
    document.getElementById("cart").style.display = "flex";
  }

  function closeCart() {
    document.getElementById("cart").style.display = "none";
  }

  function orderNow() {
    if (cart.length === 0) {
      alert("Keranjang kosong.");
      return;
    }
    document.getElementById("order-now").style.display = "flex";
  }

  function closeOrderForm() {
    document.getElementById("order-now").style.display = "none";
  }

  function generateResi() {
    return 'RESI-' + Math.random().toString(36).substr(2, 9).toUpperCase();
  }

  function submitOrder() {
    const name = document.getElementById("order-name").value;
    const address = document.getElementById("order-address").value;
    const phone = document.getElementById("order-phone").value;

    if (!name || !address || !phone) {
      alert("Lengkapi semua data pemesanan.");
      return;
    }

    const newOrder = {
      name: cart.map(item => item.name).join(', '),
      items: [...cart],
      address,
      phone,
      courier: "Kurir RalExpress",
      resi: generateResi(),
      status: "Sedang Diproses",
      chat: []
    };

    userOrders.push(newOrder);
    localStorage.setItem('orders', JSON.stringify(userOrders));

    cart = [];
    updateCartDisplay();
    closeCart();
    closeOrderForm();
    alert("Pesanan berhasil dikirim!\nNo Resi Anda: " + newOrder.resi);
  }

  function viewOrders() {
    const ordersList = document.getElementById("orders-list");
    ordersList.innerHTML = "";
    userOrders.forEach((order, index) => {
      const div = document.createElement("div");
      div.classList.add("order-item");
      div.innerHTML = `
        <div>
          <h4>${order.name}</h4>
          <p>Resi: ${order.resi}</p>
        </div>
        <div>
          <span class="order-status">${order.status}</span><br>
          <button class="track-button" onclick="trackOrder(${index})">Lacak</button>
          <button class="remove-button" onclick="removeOrder(${index})">Hapus</button>
        </div>
      `;
      ordersList.appendChild(div);
    });
    document.getElementById("orders").style.display = "flex";
  }

  function removeOrder(index) {
    userOrders.splice(index, 1);
    localStorage.setItem('orders', JSON.stringify(userOrders));
    viewOrders();
  }

  function trackOrder(index) {
    const order = userOrders[index];
    const trackingDetails = document.getElementById("tracking-details");

    trackingDetails.innerHTML = `
      <p>Alamat: <span>${order.address}</span></p>
      <p>No. Telepon: <span>${order.phone}</span></p>
      <p>Kurir: <span>${order.courier}</span></p>
      <p>No. Resi: <span>${order.resi}</span></p>
      <p>Status: <span>${order.status}</span></p>
    `;

    const chatMessages = document.getElementById("chat-messages");
    chatMessages.innerHTML = "";
    order.chat.forEach(chat => {
      const div = document.createElement("div");
      div.innerHTML = `<b>${chat.sender}</b>: ${chat.message}`;
      chatMessages.appendChild(div);
    });

    document.getElementById("tracking").style.display = "flex";
  }

  function closeTracking() {
    document.getElementById("tracking").style.display = "none";
  }

  function closeOrders() {
    document.getElementById("orders").style.display = "none";
  }
</script>

</body>
</html>
