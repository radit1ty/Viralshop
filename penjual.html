<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Halaman Penjual - ViralShop</title>
  <style>
    /* Styling untuk halaman penjual */
    body { font-family: Arial; padding: 20px; background-color: #f4f4f4; }
    .container { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
    h2 { text-align: center; }
    .order-item { background-color: #fff; padding: 10px; margin-bottom: 10px; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .update-status { margin-top: 10px; background-color: #ff5a5f; color: white; border: none; padding: 5px 10px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h2>Halaman Penjual - ViralShop</h2>
  <h3>Daftar Pesanan</h3>
  <div class="order-list" id="order-list"></div>
</div>

<script>
  // Fungsi untuk memuat daftar pesanan
  function loadOrders() {
    const orders = JSON.parse(localStorage.getItem('orders')) || [];
    let orderListHTML = '';

    orders.forEach((order, index) => {
      orderListHTML += `
        <div class="order-item">
          <h4>No Seri: ${order.orderId}</h4>
          <p>Nama: ${order.name}</p>
          <p>Alamat: ${order.address}</p>
          <p>No Telepon: ${order.phone}</p>
          <p>Status: ${order.status}</p>
          <button class="update-status" onclick="updateOrderStatus(${index})">Update Status</button>
        </div>
      `;
    });

    document.getElementById('order-list').innerHTML = orderListHTML;
  }

  // Fungsi untuk mengupdate status pesanan
  function updateOrderStatus(index) {
    const orders = JSON.parse(localStorage.getItem('orders')) || [];
    const newStatus = prompt('Masukkan status baru (e.g., Diproses, Dikirim, Selesai):', orders[index].status || 'Diproses');
    
    if (newStatus) {
      orders[index].status = newStatus;
      localStorage.setItem('orders', JSON.stringify(orders));
      loadOrders();
      alert('Status pesanan berhasil diperbarui!');
    }
  }

  // Memuat pesanan saat halaman dimuat
  loadOrders();
</script>

</body>
</html>
